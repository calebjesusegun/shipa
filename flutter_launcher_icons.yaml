flutter_launcher_icons:
  android: true
  ios: true
  # IOS settings
  remove_alpha_ios: true
  image_path_ios: "assets/png/logo.png"
  image_path_ios_dark_transparent: "assets/png/logo.png"
  desaturate_tinted_to_grayscale_ios: true
  # Android settings
  min_sdk_android: 23
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground_inset: 24
  image_path_android: "assets/png/logo.png"
  adaptive_icon_foreground: "assets/png/logo.png"
